name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ["lua5.1", "luajit"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lua 5.1, LuaJIT and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 liblua5.1-0-dev luajit luarocks
          sudo luarocks --lua-version 5.1 install luacheck
      - name: Generated data is up to date
        run: node tools/build_data.js --check
      - name: Lua 5.1 syntax + compliance lint
        run: python3 tools/lint51.py
      - name: luacheck
        run: luacheck WoWBoxer tests
      - name: Export test vectors from the companion seed (locale, share tests)
        run: node tools/export_vectors.js
      - name: Share-string reference tests (JS)
        run: if [ -f share/test.js ]; then node share/test.js; fi
      - name: Lua tests (golden snapshot, saved data, mocks, UI smoke)
        run: LUA=${{ matrix.lua }} tests/run_all.sh
      - name: Upload scripts (selftests + Wago dry run on a packaged zip, no upload)
        if: matrix.lua == 'lua5.1'
        run: |
          python3 tools/cf_upload.py --selftest
          python3 tools/wago_upload.py --selftest
          bash tools/package.sh 0.0.0-beta.ci
          python3 tools/wago_upload.py --dry-run dist/WoWBoxer-0.0.0-beta.ci.zip 0.0.0-beta.ci
