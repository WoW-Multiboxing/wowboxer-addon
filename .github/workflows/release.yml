name: release
# Runs when a version tag is pushed (git tag v0.9.0 && git push origin v0.9.0), or by hand for an existing tag
# (Actions -> release -> Run workflow, e.g. to upload to CurseForge after the project was set up). Same checks as CI,
# then the zip from tools/package.sh goes on a GitHub Release and to CurseForge (tools/cf_upload.py; skipped until the
# CF_API_KEY secret and the CF_PROJECT_ID variable exist - see docs/release.md), then to Wago Addons
# (tools/wago_upload.py; skipped without WAGO_API_TOKEN / WAGO_PROJECT_ID, never fails the run). A manual run can skip
# CurseForge (an existing tag that is already there) and run Wago as upload, dry-run or skip.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.9.0"
        required: true
      curseforge:
        description: "Upload to CurseForge (off for a tag that is already there)"
        type: boolean
        default: true
      wago:
        description: "Wago Addons"
        type: choice
        options: [upload, dry-run, skip]
        default: upload
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      # the upload scripts come from the workflow's own commit, so an older tag can go to Wago too
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version 5.1 install luacheck
      - name: Checks
        run: |
          node tools/build_data.js --check
          python3 tools/lint51.py
          luacheck WoWBoxer tests
          node tools/export_vectors.js
          node share/test.js          # writes the fixtures tests/test_share.lua reads
          LUA=lua5.1 tests/run_all.sh
          python3 tools/cf_upload.py --selftest
          [ ! -f tools/wago_upload.py ] || python3 tools/wago_upload.py --selftest
      - name: Package
        run: |
          VER="${TAG#v}"
          bash tools/package.sh "$VER"
          # changelog: docs/changes/<version>.md if written, else commit subjects since the previous tag
          if [ -f "docs/changes/$VER.md" ]; then cp "docs/changes/$VER.md" dist/CHANGELOG.md; else
            PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            { echo "## WoWBoxer $VER"; echo; git log --no-merges --format='- %s' ${PREV:+$PREV..}"$TAG" | grep -v -E '^- (docs|tests?|ci|release)[:(/]' | head -30; } > dist/CHANGELOG.md
          fi
          cat dist/CHANGELOG.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then echo "release $TAG exists"; else
            gh release create "$TAG" "dist/WoWBoxer-$VER.zip" --title "WoWBoxer $VER" --notes-file dist/CHANGELOG.md \
              $( [[ "$VER" == *-* ]] && echo --prerelease )
          fi
      - name: Website screenshots (site-screenshots.zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls media/screenshots/*/manifest.json > /dev/null 2>&1; then
            (cd media && zip -qr ../dist/site-screenshots.zip screenshots -x 'screenshots/shots.json')
            gh release upload "$TAG" dist/site-screenshots.zip --clobber
          else echo "no exported screenshots yet"; fi
      - name: CurseForge
        if: github.event_name == 'push' || inputs.curseforge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS }}
        run: python3 tools/cf_upload.py "dist/WoWBoxer-${TAG#v}.zip" "${TAG#v}" dist/CHANGELOG.md
      - name: Wago Addons
        if: inputs.wago != 'skip'
        continue-on-error: true
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WAGO_PROJECT_ID: ${{ vars.WAGO_PROJECT_ID }}
          DRY: ${{ inputs.wago == 'dry-run' && '--dry-run' || '' }}
        run: python3 .release-tools/tools/wago_upload.py $DRY "dist/WoWBoxer-${TAG#v}.zip" "${TAG#v}" dist/CHANGELOG.md
      # Discord (WS-H, 99_Noter/Prompts-H-2026-11-02.md §E): plain tag -> #announcements + @Updates, -beta/-rc -> #beta
      # + @Beta testers, -alpha/-test never. Only on a real tag push (a manual re-run would post twice). Without the
      # webhook secrets the script prints a notice and exits 0; continue-on-error keeps Discord from failing a release.
      - name: Discord announcement
        if: success() && github.event_name == 'push'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_ANNOUNCEMENTS: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS }}
          DISCORD_WEBHOOK_BETA: ${{ secrets.DISCORD_WEBHOOK_BETA }}
          DISCORD_ROLE_UPDATES: ${{ vars.DISCORD_ROLE_UPDATES }}
          DISCORD_ROLE_BETA: ${{ vars.DISCORD_ROLE_BETA }}
        run: node .release-tools/tools/discord-announce.mjs release --product addon --tag "$TAG" --notes-file dist/CHANGELOG.md
